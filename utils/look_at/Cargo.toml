[package]
name = "look_at"
description = "Forwards items from a selected implementation module with a procedural macro."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GeminiLab/ecraOS"
documentation = "https://docs.rs/look_at"
readme = "README.md"
keywords = ["forwarding", "re-export", "architecture", "facade", "procedural-macro"]
categories = ["development-tools::procedural-macro-helpers", "rust-patterns"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
