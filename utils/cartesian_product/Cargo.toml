[package]
name = "cartesian_product"
description = "Generates Cartesian product tuple arrays with a procedural macro."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GeminiLab/ecraOS"
documentation = "https://docs.rs/cartesian_product"
readme = "README.md"
keywords = ["cartesian-product", "macro", "procedural-macro", "tuples"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
