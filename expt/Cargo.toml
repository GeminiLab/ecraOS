[package]
name = "expt"
description = "Flexible and efficient architecture-independent multi-level page table structures."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GeminiLab/ecraOS"
documentation = "https://docs.rs/expt"
readme = "README.md"
keywords = ["paging", "page-table", "virtual-memory", "no-std"]
categories = ["data-structures", "memory-management", "no-std"]

[dependencies]
cfg-if.workspace = true
dyn_static_traits = { path = "../utils/dyn_static_traits" }
expalloc_trait = { path = "../expalloc_trait" }
expanic = { path = "../expanic" }
heapless = "0.9"
maybe_non_generic = { path = "../utils/maybe_non_generic" }
memory_addr.workspace = true
page_table_entry = "0.6.1"
thiserror.workspace = true

[target.'cfg(any(target_arch = "x86_64", ecraos_doc))'.dependencies]
x86 = "0.52"

[target.'cfg(any(target_arch = "riscv64", ecraos_doc))'.dependencies]
riscv = { version = "0.16", default-features = false }

[target.'cfg(any(target_arch = "aarch64", ecraos_doc))'.dependencies]
aarch64-cpu = "11"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "ecraos_doc"]
rustdoc-args = ["--cfg", "ecraos_doc"]
