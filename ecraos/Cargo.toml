[package]
name = "ecraos"
version = "0.1.0"
edition = "2024"

[dependencies]
bitmaps = { version = "3.2.1", default-features = false }
heapless = "0.9"
exarch = { path = "../exarch" }
exboot = { path = "../exboot/exboot" }
exbuddy = { path = "../exbuddy" }
expalloc_trait = { path = "../expalloc_trait" }
expercpu = { path = "../expercpu/expercpu", features = ["early-slot", "remote-access"] }
expt = { path = "../expt" }
exslab = { path = "../exslab" }
crate_interface = { version = "0.3", features = ["weak_default"] }
kspin = { version = "0.2", features = ["smp"] }
lazyinit.workspace = true
log.workspace = true
memory_addr.workspace = true
memory_range_set = { path = "../memory_range_set" }
size-disp = { path = "../size-disp" }
thiserror.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
acpi = "6"
