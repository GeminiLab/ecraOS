[workspace]
resolver = "3"
members = [
    "ecraos",
    "exarch",
    "exbuddy",
    "expalloc_trait",
    "expercpu/expercpu",
    "expercpu/expercpu_macros",
    "expt",
    "exslab",
    "utils/dyn_static_traits",
    "utils/look_at",
    "utils/maybe_non_generic",
    "utils/memory_range_set",
    "utils/size_disp",
    "utils/product",
]

[workspace.dependencies]
cfg-if = "1.0"
# TODO: move it out of ecraldr, rename it, add version number when passing arguments to kernel
ecraldr_base = { path = "../ecraldr/ecraldr_base" }
kspin = "0.2"
lazyinit = "0.2"
log = "0.4"
memory_addr = "0.4.1"
thiserror = { version = "2.0", default-features = false }

[patch.crates-io]
memory_addr = { git = "https://github.com/arceos-org/axmm_crates/", rev = "d4fc64141cb6544d41d43810e96008edb6560fff" }
