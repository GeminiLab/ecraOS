[package]
name = "exarch"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.11"
cartesian_product = { path = "../utils/cartesian_product" }
cfg_or_dummy = { path = "../utils/cfg_or_dummy" }
crate_interface = { version = "0.3", features = ["weak_default"] }
ecraldr_base.workspace = true
expalloc_trait = { path = "../expalloc_trait" }
expercpu = { path = "../expercpu/expercpu" }
expt = { path = "../expt" }
heapless = "0.9"
kspin.workspace = true
lazyinit.workspace = true
log.workspace = true
look_at = { path = "../utils/look_at" }
memory_addr.workspace = true
page_table_entry = "0.6.1"

[target.'cfg(any(target_arch = "x86_64", ecraos_doc))'.dependencies]
multiboot = "0.8"
raw-cpuid = "11.6"
uart_16550 = "0.4"  # later versions cannot be used because of the lack of const constructors
x2apic = "0.5"
x86 = "0.52"
x86_64 = "0.15.4"

[target.'cfg(any(target_arch = "riscv64", ecraos_doc))'.dependencies]
fdt-rs = { version = "0.4", default-features = false }
riscv = "0.16"
sbi-rt = { version = "0.0.4" }

[target.'cfg(any(target_arch = "aarch64", ecraos_doc))'.dependencies]
aarch64-cpu = "11"
fdt-rs = { version = "0.4", default-features = false }
tock-registers = "0.10"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "ecraos_doc"]
