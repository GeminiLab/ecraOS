[workspace]
members = [
    "default",
    "ipi",
    "sleep-join",
    "sync-preemption",
]
resolver = "3"

[workspace.dependencies]
ecraos = { path = "../ecraos" }
log = "0.4"

[patch.crates-io]
page_table_entry = { path = "../page_table_entry" }
