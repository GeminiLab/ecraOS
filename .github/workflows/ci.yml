name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
          components: rust-src, clippy, rustfmt, llvm-tools
          targets: x86_64-unknown-none, riscv64gc-unknown-none-elf

      - name: Run host test suite
        run: scripts/test-host.sh

  qemu-tests:
    name: QEMU test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep libslirp0

      - name: Install QEMU
        uses: arceos-org/setup-qemu@v1
        with:
          version: '9.2.3'
          arch_list: 'x86_64,riscv64'

      - name: Report QEMU versions
        run: |
          qemu-system-x86_64 --version
          qemu-system-riscv64 --version

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02
          components: rust-src, clippy, rustfmt, llvm-tools
          targets: x86_64-unknown-none, riscv64gc-unknown-none-elf

      - name: Install cargo-binutils
        run: cargo install cargo-binutils --locked

      - name: Run QEMU test matrix
        run: scripts/test-matrix.sh

      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: target/qemu-logs/*.log
          if-no-files-found: warn
          retention-days: 7
