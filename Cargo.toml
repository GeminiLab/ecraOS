[workspace]
resolver = "3"
members = [
    "ecraos",
    "exarch",
    "exbuddy",
    "expalloc_trait",
    "expanic",
    "expercpu/expercpu",
    "expercpu/expercpu_macros",
    "expt",
    "exslab",
    "exspin",
    "page_table_entry",
    "utils/cartesian_product",
    "utils/cfg_or_dummy",
    "utils/dyn_static_traits",
    "utils/look_at",
    "utils/maybe_non_generic",
    "utils/memory_range_set", "utils/semantic_types",
    "utils/size_disp",
]
exclude = [
    "ecraldr",
    "smoke-apps",
    "xtask",
]

[workspace.dependencies]
cfg-if = "1.0"
# TODO: move it out of ecraldr, rename it, add version number when passing arguments to kernel
ecraldr_base = { path = "ecraldr/ecraldr_base" }
exspin = { path = "exspin" }
lazyinit = "0.2"
log = "0.4"
memory_addr = "0.5.0-alpha.const-addr-and-ranges.0"
thiserror = { version = "2.0", default-features = false }

[patch.crates-io]
page_table_entry = { path = "page_table_entry" }
