[workspace]
resolver = "3"
members = [
    "ecraldr",
    "ecraldr-riscv64-none",
    "ecraldr-aarch64-linux",
    "ecraldr-x86_64-multiboot",
    "ecraldr_base",
    "ecraldr_base_macros",
]
exclude = [
    "ecraldr_build_rs",
]

[workspace.dependencies]
cfg-if = "1.0"
kspin = "0.2"
lazyinit = "0.2"
log = "0.4"
memory_addr = "0.4.1"
thiserror = { version = "2.0", default-features = false }

[patch.crates-io]
memory_addr = { git = "https://github.com/arceos-org/axmm_crates/", rev = "d4fc64141cb6544d41d43810e96008edb6560fff" }
